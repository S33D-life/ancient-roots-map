name: Audit database boundaries
on:
  pull_request:
    paths:
      - 'scripts/audit-tests/**'
      - 'scripts/lib/auditDatabase.mjs'
      - 'supabase/migrations/**'
      - 'supabase/functions/offering-media/**'
      - 'supabase/functions/api-gateway/**'
      - '.github/workflows/audit-boundaries.yml'
permissions:
  contents: read
jobs:
  fictional-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_DB: postgres
          # Disposable synthetic database, bound to runner loopback only.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55441:5432'
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run fictional authorization and independent-session race tests
        shell: bash
        env:
          S33D_CI_POSTGRES: '1'
        run: |
          set -euo pipefail
          for test in scripts/audit-tests/*.mjs; do
            node "$test"
          done
