name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint / Typecheck / Unit / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check
        run: npm run security:check

      - name: Config churn guard
        run: npm run guard:config-churn

      - name: Duplicate artifact guard
        run: npm run check:duplicates

      - name: Asset budget guard
        run: npm run guard:assets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Static Council freshness
        run: npm run council:static:check

      - name: Invitation freshness
        run: npm run council:share:check

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Record artifact provenance
        env:
          REVIEWED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/SOURCE_SHA
          printf '%s\n' "$REVIEWED_PR_HEAD" > release-evidence/PR_HEAD_SHA
          printf '%s\n' "$PR_BASE_SHA" > release-evidence/PR_BASE_SHA
          printf '%s\n' "$EVENT_NAME" > release-evidence/EVENT
          printf '%s\n' "$GITHUB_SHA" > release-evidence/GITHUB_SHA
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > release-evidence/RUN
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > release-evidence/SHA256SUMS
          (cd release-evidence && sha256sum SHA256SUMS > MANIFEST.sha256)
          (cd dist && sha256sum -c ../release-evidence/SHA256SUMS)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            release-evidence
          retention-days: 30
          if-no-files-found: error

  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifact

      - name: Verify and use the recorded artifact
        run: |
          (cd artifact/release-evidence && sha256sum -c MANIFEST.sha256)
          test "$(git rev-parse HEAD)" = "$(cat artifact/release-evidence/SOURCE_SHA)"
          (cd artifact/dist && sha256sum -c ../release-evidence/SHA256SUMS)
          cp -a artifact/dist ./dist

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
