name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint / Typecheck / Unit / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check
        run: npm run security:check

      - name: Config churn guard
        run: npm run guard:config-churn

      - name: Duplicate artifact guard
        run: npm run check:duplicates

      - name: Asset budget guard
        run: npm run guard:assets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Static Council freshness
        run: npm run council:static:check

      - name: Invitation freshness
        run: npm run council:share:check

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify Council public artifact privacy
        run: node scripts/check-council-public-bytes.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: validate
    # Playwright 1.59.1 supports Ubuntu 24.04; latest selected unsupported 26.04.
    runs-on: ubuntu-24.04
    # Cold browser/OS bootstrap plus the original Tree history acceptance needs this budget.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR synthetic merge commit plus its parent; unknown diff => full browser coverage.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Test conservative browser-scope classifier
        run: node --test scripts/ci-e2e-scope.test.mjs

      - name: Determine required browser coverage
        id: browser_scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_MERGE_SHA: ${{ github.sha }}
        run: node scripts/ci-e2e-scope.mjs

      - name: Document docs-only bypass
        if: steps.browser_scope.outputs.run_full == 'false'
        run: echo "Exactly allowlisted docs-only PR; full Playwright not executed. Validate/security/static Council/unit/build still ran." >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: steps.browser_scope.outputs.run_full == 'true'
        run: npm ci

      - name: Download build artifact
        if: steps.browser_scope.outputs.run_full == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright (chromium only)
        if: steps.browser_scope.outputs.run_full == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        if: steps.browser_scope.outputs.run_full == 'true'
        run: npx playwright test
        env:
          CI: "true"

      - name: Circle 237 disconnected application and mobile journeys
        if: steps.browser_scope.outputs.run_full == 'true'
        run: npx playwright test --config playwright.circle237-integration.config.ts --project=chromium
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results
            output/playwright/circle237-integration
            playwright-report
          retention-days: 7
